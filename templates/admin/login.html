<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Login</title>
    <style>
        * {
            box-sizing: border-box;
            font-family: Arial, sans-serif;
        }
        body {
            margin: 0;
            background: #f4f6f9;
            display: flex;
            align-items: center;
            justify-content: center;
            min-height: 100vh;
            padding: 24px;
        }
        .card {
            width: 100%;
            max-width: 380px;
            background: white;
            border-radius: 12px;
            box-shadow: 0 6px 20px rgba(10, 42, 67, 0.12);
            padding: 24px;
        }
        h1 {
            margin: 0 0 6px;
            font-size: 22px;
            color: #0a2a43;
        }
        p {
            margin: 0 0 18px;
            color: #64748b;
            font-size: 14px;
        }
        label {
            display: block;
            font-size: 13px;
            color: #334155;
            margin-bottom: 6px;
        }
        input[type="password"] {
            width: 100%;
            padding: 10px 12px;
            border: 1px solid #cbd5f5;
            border-radius: 8px;
            font-size: 14px;
        }
        .error {
            background: #fee2e2;
            color: #991b1b;
            padding: 10px;
            border-radius: 8px;
            margin-bottom: 12px;
            font-size: 13px;
        }
        .btn {
            width: 100%;
            margin-top: 14px;
            background: #1e90ff;
            color: white;
            border: 0;
            border-radius: 8px;
            padding: 10px 12px;
            font-size: 14px;
            cursor: pointer;
        }
        .hint {
            margin-top: 12px;
            font-size: 12px;
            color: #94a3b8;
            text-align: center;
        }
    </style>
</head>
<body>
    <div class="card">
        <h1>Admin Access</h1>
        <p>Masukkan password untuk mengelola data kereta.</p>
        {% if error %}
            <div class="error">{{ error }}</div>
        {% endif %}
        <form method="POST">
            <label for="password">Password</label>
            <input type="password" id="password" name="password" required>
            <input type="hidden" name="next" value="{{ next_url }}">
            <button type="submit" class="btn">Masuk</button>
        </form>
        <div class="hint">Akses admin: ketik URL `/admin` secara manual.</div>
    </div>
</body>
</html>
