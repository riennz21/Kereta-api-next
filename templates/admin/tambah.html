{% extends "admin/base.html" %}
{% block title %}Tambah Kereta | KERETA.ID{% endblock %}
{% block page_title %}Tambah Data Kereta{% endblock %}

{% block content %}
<div class="container">
    <form method="POST" enctype="multipart/form-data" class="form-kereta" onsubmit="return validasiForm()">
        <div class="form-group">
            <label>Nama Kereta</label>
            <input type="text" name="nama" id="nama" placeholder="Nama Kereta" required>
        </div>

        <div class="form-group">
            <label>Foto Kereta</label>
            <input type="file" name="gambar" accept="image/*">
            <small class="hint">Opsional, format: jpg/png/webp/gif</small>
        </div>

        <div class="form-group">
            <label>Asal</label>
            <input type="text" name="asal" id="asal" placeholder="Asal" required>
        </div>

        <div class="form-group">
            <label>Tujuan</label>
            <input type="text" name="tujuan" id="tujuan" placeholder="Tujuan" required>
        </div>

        <div class="form-group">
            <label>Kelas</label>
            <select name="kelas" id="kelas" onchange="aturHarga()" required>
                <option value="">-- Pilih Kelas --</option>
                <option value="Ekonomi">Ekonomi</option>
                <option value="Bisnis">Bisnis</option>
                <option value="Eksekutif">Eksekutif</option>
            </select>
        </div>

        <div class="form-group">
            <label>Harga</label>
            <input type="number" name="harga" id="harga" min="0" required>
        </div>

        <div class="form-group">
            <label>Tanggal</label>
            <input type="date" name="tanggal" id="tanggal" required>
        </div>

        <div class="form-group">
            <label>Jam</label>
            <input type="time" name="jam" id="jam" required>
        </div>

        <div class="form-group">
            <label>Status</label>
            <select name="status" required>
                <option value="On Time">On Time</option>
                <option value="Delay">Delay</option>
                <option value="Dibatalkan">Dibatalkan</option>
            </select>
        </div>

        <div class="form-group full">
            <label>Deskripsi</label>
            <textarea name="deskripsi" placeholder="Deskripsi kereta (opsional)" rows="4"></textarea>
        </div>

        <div class="form-actions full">
            <button type="submit" class="btn-primary">Simpan</button>
            <a href="{{ url_for('admin_data_kereta') }}" class="btn-secondary">Batal</a>
        </div>
    </form>
</div>
{% endblock %}
