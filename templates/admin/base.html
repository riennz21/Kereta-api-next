<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}KERETA.ID{% endblock %}</title>
    <link rel="stylesheet" href="{{ url_for('static', filename='main.css') }}">
</head>
<body>

<div class="dashboard">
    <aside class="sidebar">
        <h2>KERETA.ID</h2>
        <ul>
            <li class="{{ 'active' if active_page == 'dashboard' else '' }}">
                <a href="{{ url_for('admin_dashboard') }}">Dashboard</a>
            </li>
            <li class="{{ 'active' if active_page == 'kereta' else '' }}">
                <a href="{{ url_for('admin_data_kereta') }}">Data Kereta</a>
            </li>
            <li class="{{ 'active' if active_page == 'jadwal' else '' }}">
                <a href="{{ url_for('admin_jadwal') }}">Jadwal</a>
            </li>
            <li class="{{ 'active' if active_page == 'status' else '' }}">
                <a href="{{ url_for('admin_status') }}">Status</a>
            </li>
            <li class="{{ 'active' if active_page == 'laporan' else '' }}">
                <a href="{{ url_for('admin_laporan') }}">Laporan</a>
            </li>
        </ul>
    </aside>

    <main class="main">
        <header class="topbar">
            <h1>{% block page_title %}{% endblock %}</h1>
            <div class="topbar-actions">
                {% block topbar_actions %}{% endblock %}
                <a href="{{ url_for('admin_logout') }}" class="btn-secondary">Logout</a>
            </div>
        </header>

        {% block content %}{% endblock %}
    </main>
</div>

<script src="{{ url_for('static', filename='main.js') }}"></script>
{% block extra_scripts %}{% endblock %}
</body>
</html>
