<!DOCTYPE html>
<html lang="id">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Edit Kereta - TiketKAI</title>
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
        }
        
        body {
            background-color: #f5f5f5;
        }
        
        header {
            background: white;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            padding: 15px 0;
        }
        
        .navbar {
            max-width: 1200px;
            margin: 0 auto;
            padding: 0 20px;
            display: flex;
            justify-content: space-between;
            align-items: center;
        }
        
        nav ul {
            display: flex;
            list-style: none;
        }
        
        nav ul li {
            margin: 0 20px;
        }
        
        nav ul li a {
            text-decoration: none;
            color: #666;
            font-weight: 600;
        }
        
        .container {
            max-width: 800px;
            margin: 0 auto;
            padding: 40px 20px;
        }
        
        h1 {
            margin-bottom: 30px;
            color: #333;
        }
        
        .form-group {
            margin-bottom: 20px;
        }
        
        label {
            display: block;
            margin-bottom: 5px;
            color: #333;
            font-weight: 600;
        }
        
        input, textarea, select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }
        
        textarea {
            resize: vertical;
            min-height: 100px;
        }
        
        .form-row {
            display: grid;
            grid-template-columns: 1fr 1fr;
            gap: 20px;
        }
        
        .btn {
            background: #f37021;
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 5px;
            font-weight: bold;
            cursor: pointer;
            margin-right: 10px;
        }
        
        .btn:hover {
            background: #d94f15;
        }
        
        .btn-cancel {
            background: #666;
        }
        
        .btn-cancel:hover {
            background: #555;
        }
        
        .button-group {
            margin-top: 30px;
        }
        
        .image-preview {
            margin-top: 10px;
        }
        
        .image-preview img {
            max-width: 200px;
            border-radius: 5px;
        }
    </style>
</head>
<body>
    <header>
        <div class="navbar">
            <div class="logo">
                <h2>TiketKAI</h2>
            </div>
            <nav>
                <ul>
                    <li><a href="/">HOME</a></li>
                    <li><a href="/kereta">DATA KERETA</a></li>
                    <li><a href="/jadwal">JADWAL</a></li>
                    <li><a href="/status">STATUS</a></li>
                </ul>
            </nav>
        </div>
    </header>
    
    <div class="container">
        <h1>Edit Kereta</h1>
        
        <form method="POST" enctype="multipart/form-data">
            <div class="form-row">
                <div class="form-group">
                    <label for="nama">Nama Kereta</label>
                    <input type="text" id="nama" name="nama" value="{{ data[1] }}" required>
                </div>
                <div class="form-group">
                    <label for="kelas">Kelas</label>
                    <select id="kelas" name="kelas" required>
                        <option value="Eksekutif" {% if data[4] == 'Eksekutif' %}selected{% endif %}>Eksekutif</option>
                        <option value="Bisnis" {% if data[4] == 'Bisnis' %}selected{% endif %}>Bisnis</option>
                        <option value="Ekonomi" {% if data[4] == 'Ekonomi' %}selected{% endif %}>Ekonomi</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="asal">Asal</label>
                    <input type="text" id="asal" name="asal" value="{{ data[2] }}" required>
                </div>
                <div class="form-group">
                    <label for="tujuan">Tujuan</label>
                    <input type="text" id="tujuan" name="tujuan" value="{{ data[3] }}" required>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="harga">Harga</label>
                    <input type="text" id="harga" name="harga" value="{{ data[5] }}" required>
                </div>
                <div class="form-group">
                    <label for="status">Status</label>
                    <select id="status" name="status" required>
                        <option value="On Time" {% if data[8] == 'On Time' %}selected{% endif %}>On Time</option>
                        <option value="Delay" {% if data[8] == 'Delay' %}selected{% endif %}>Delay</option>
                    </select>
                </div>
            </div>
            
            <div class="form-row">
                <div class="form-group">
                    <label for="tanggal">Tanggal</label>
                    <input type="date" id="tanggal" name="tanggal" value="{{ data[6] }}" required>
                </div>
                <div class="form-group">
                    <label for="jam">Jam</label>
                    <input type="time" id="jam" name="jam" value="{{ data[7] }}" required>
                </div>
            </div>
            
            <div class="form-group">
                <label for="deskripsi">Deskripsi</label>
                <textarea id="deskripsi" name="deskripsi">{{ data[9] or '' }}</textarea>
            </div>
            
            <div class="form-group">
                <label for="gambar">Gambar</label>
                <input type="file" id="gambar" name="gambar" accept="image/*">
                {% if data[10] %}
                <div class="image-preview">
                    <p>Gambar saat ini:</p>
                    <img src="{{ url_for('train_image', filename=data[10]) }}" alt="Gambar Kereta">
                </div>
                {% endif %}
            </div>
            
            <div class="button-group">
                <button type="submit" class="btn">Simpan Perubahan</button>
                <a href="/kereta" class="btn btn-cancel">Batal</a>
            </div>
        </form>
    </div>
</body>
</html>
